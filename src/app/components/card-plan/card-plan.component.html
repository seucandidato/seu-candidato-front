<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card com Ícones</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
    <div class="card" style="width: 16rem;">
        <div class="card-header d-flex">
            <h5 class="card-title">{{ plan.title }}</h5>
        </div>
        <div class="card-body">

            <ul class="list-unstyled">
                @for(benefit of plan.benefits; track $index) {
                <li><i class="bi bi-check2-circle"></i> {{benefit.title}}</li>
                }
            </ul>

            @if(plan.title === "Personalizado") {
                <span class="main-amount">Sob Análise</span>
                <div class="price-text custom">mês</div>
            } @else {
                <div class="price-container">
                    <span class="price">
                        <span class="currency">R$</span>
                        <span class="main-amount">{{ amount }}</span>,
                        <span class="cents">{{ cents }}</span>
                    </span>
                    <div class="price-text">mês</div>
                </div>
            }



            <a href="#" class="btn btn-primary">Contratar</a>
        </div>
    </div>

    <!-- Adicione o JS do Bootstrap, se necessário -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
